[project]
name = "algoease-contracts"
version = "0.1.0"
description = "AlgoEase v2 AlgoPy smart contracts"
requires-python = ">=3.11"
dependencies = [
    "algopy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
