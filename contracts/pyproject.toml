[project]
name = "algoease-contracts"
version = "2.0.0"
description = "AlgoEase v2 AlgoPy smart contracts (BoxMap multi-escrow)"
requires-python = ">=3.12"
dependencies = [
    "algorand-python>=3.5.0",
    "puyapy>=5.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "algorand-python-testing",
]

[tool.pytest.ini_options]
pythonpath = ["src", "algoease_escrow"]
testpaths = ["tests", "algoease_escrow/tests"]
